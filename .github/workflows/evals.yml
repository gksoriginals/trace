name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stub evals
        run: python3 evals/run.py --agent stub
      - name: Skill-script evals
        run: python3 evals/run.py --agent skill
      - name: Shared core checks
        run: python3 -m unittest discover -s skills/shared/tests -v
